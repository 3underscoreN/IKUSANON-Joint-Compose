services:
  nginx:
    container_name: ikusanon-web-nginx-prod
    image: nginx:latest
    ports:
      - "83:80"
    restart: unless-stopped
    depends_on:
      - web
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - webbot_network

  web:
    container_name: ikusanon-boostday-form-web-prod
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=${DATABASE_URL}
    expose:
      - "3000"
    restart: unless-stopped
    depends_on:
      - postgres
    networks:
      - webdb_network
      - webbot_network

  postgres:
    container_name: ikusanon-boostday-form-postgres-prod
    image: postgres:15
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-ikusanon_boostday_form_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    expose:
      - "5432"
    networks:
      - webdb_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ikusanon_boostday_form_prod} -h localhost",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    container_name: ikusanon-bot-prod
    build:
      context: ./apps/bot
      dockerfile: Dockerfile
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN:-}
      - PARSER_SEGA_ID=${PARSER_SEGA_ID:-}
      - PARSER_SEGA_PW=${PARSER_SEGA_PW:-}
      - WEB_URL_BASE=${WEB_URL_BASE:-http://localhost:83}
      - WEB_API_URL_BASE=${WEB_API_URL_BASE:-http://web:3000}
      - BOT_OWNER=${BOT_OWNER:-}
    restart: unless-stopped
    init: true
    volumes:
      - ./apps/bot/data:/app/data
    networks:
      - webbot_network
    depends_on:
      - web

networks:
  webdb_network:
    driver: bridge
    internal: true
  webbot_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
