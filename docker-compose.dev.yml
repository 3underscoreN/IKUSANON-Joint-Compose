services:
  web:
    container_name: ikusanon-boostday-form-web-dev
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=${DATABASE_URL}
    ports:
      - "3000:3000"
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - webdb_network_dev
      - webbot_network_dev

  # One-shot job: applies Prisma migrations before the web container starts.
  # The migration toolchain is deliberately kept out of the runtime image.
  migrate:
    container_name: ikusanon-boostday-form-migrate-dev
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: migrate
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      # Keep an egress-capable network available for a hosted DATABASE_URL.
      - webdb_network_dev
      - webbot_network_dev
    restart: "no"

  # One-shot job: downloads the song JSON and hands it to the internal
  # updatesongs API after web is healthy. Set SONG_SOURCE_URL in .env.dev.
  song-sync:
    container_name: ikusanon-boostday-form-song-sync-dev
    image: curlimages/curl:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        curl --fail --silent --show-error --location \
          --retry 3 --retry-delay 2 --max-time 300 \
          --output /tmp/songs.json \
          "$${SONG_SOURCE_URL}"
        if ! grep -q '{' /tmp/songs.json; then
          echo "Song source returned no song objects; refusing to sync." >&2
          exit 1
        fi
        curl --fail-with-body --silent --show-error \
          --request POST \
          --header "Content-Type: application/json" \
          --data-binary @/tmp/songs.json \
          --max-time 300 \
          "http://web:3000/api/v1/internal/updatesongs"
    environment:
      - SONG_SOURCE_URL=${SONG_SOURCE_URL:?SONG_SOURCE_URL must be set}
    depends_on:
      web:
        condition: service_healthy
    networks:
      - webbot_network_dev
    restart: "no"

  postgres:
    container_name: ikusanon-boostday-form-postgres-dev
    image: postgres:15
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-ikusanon_boostday_form_dev}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    restart: unless-stopped
    ports:
      - "5432:5432"
    networks:
      - webdb_network_dev
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ikusanon_boostday_form_dev} -h localhost",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    container_name: ikusanon-bot-dev
    build:
      context: ./apps/bot
      dockerfile: Dockerfile
    env_file: .env.dev
    restart: unless-stopped
    init: true
    # The bot runs as UID/GID 1000 inside the image; on Linux hosts make sure
    # this bind mount is writable by that user (e.g. sudo chown -R 1000:1000
    # apps/bot/data), or use a named volume instead.
    volumes:
      - ./apps/bot/data:/app/data
    networks:
      - webbot_network_dev
    depends_on:
      - web

  extractor:
    container_name: ikusanon-extractor-dev
    image: ghcr.io/3underscoren/chunithm-score-extractor:latest
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - webbot_network_dev
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  webdb_network_dev:
    driver: bridge
    # internal: true
  webbot_network_dev:
    driver: bridge

volumes:
  postgres_data_dev:
    driver: local
