services:
  web:
    container_name: ikusanon-boostday-form-web-dev
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=${DATABASE_URL}
    ports:
      - '3000:3000'
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - webdb_network
      - webbot_network

  # One-shot job: applies Prisma migrations before the web container starts.
  # The migration toolchain is deliberately kept out of the runtime image.
  migrate:
    container_name: ikusanon-boostday-form-migrate-dev
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: migrate
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      # Keep an egress-capable network available for a hosted DATABASE_URL.
      - webdb_network
      - webbot_network
    restart: 'no'

  postgres:
    container_name: ikusanon-boostday-form-postgres-dev
    image: postgres:15
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-ikusanon_boostday_form_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    ports:
      - '5432:5432'
    networks:
      - webdb_network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ikusanon_boostday_form_dev} -h localhost',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    container_name: ikusanon-bot-dev
    build:
      context: ./apps/bot
      dockerfile: Dockerfile
    env_file: .env.dev
    restart: unless-stopped
    init: true
    # The bot runs as UID/GID 1000 inside the image; on Linux hosts make sure
    # this bind mount is writable by that user (e.g. sudo chown -R 1000:1000
    # apps/bot/data), or use a named volume instead.
    volumes:
      - ./apps/bot/data:/app/data
    networks:
      - webbot_network
    depends_on:
      - web

networks:
  webdb_network:
    driver: bridge
    # internal: true
  webbot_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local

